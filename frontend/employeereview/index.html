<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10243b" />
    <title>Submit Performance Review | Testleaf</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172b43;
        background: #f3f6fa;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --navy: #10243b;
        --blue: #1672d4;
        --muted: #64758b;
        --border: #dce3eb;
        --orange: #f4a51c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      button,
      select,
      textarea {
        font: inherit;
      }

      .app-shell {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        display: flex;
        flex: 0 0 224px;
        flex-direction: column;
        padding: 27px 16px;
        color: #d6e1ed;
        background: var(--navy);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 8px 38px;
        color: #fff;
        font-size: 17px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }

      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid #42bd8b;
        border-radius: 9px;
        color: #42bd8b;
        font-size: 19px;
        font-weight: 800;
      }

      .nav-links {
        display: grid;
        gap: 7px;
      }

      .nav-link {
        display: flex;
        min-height: 42px;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        border-radius: 7px;
        color: #c1cede;
        font-size: 13px;
        text-decoration: none;
      }

      .nav-link[aria-current="page"] {
        color: #fff;
        background: #1768bb;
        font-weight: 650;
      }

      .nav-icon {
        width: 17px;
        color: #a9bdcf;
        text-align: center;
      }

      main {
        flex: 1;
        min-width: 0;
        padding: 42px clamp(20px, 5vw, 72px);
      }

      .form-card {
        max-width: 960px;
        margin: 0 auto;
        padding: clamp(22px, 4vw, 38px);
        border: 1px solid #e2e8ef;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 30px rgb(16 36 59 / 5%);
      }

      .form-card h2 {
        margin: 0 0 25px;
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label,
      .rating-title {
        color: #293b50;
        font-size: 13px;
        font-weight: 650;
      }

      .required {
        color: #d74343;
      }

      select,
      textarea {
        width: 100%;
        border: 1px solid #cfd8e3;
        border-radius: 7px;
        background: #fff;
        color: #253950;
        outline: none;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      select {
        min-height: 43px;
        padding: 0 12px;
      }

      textarea {
        min-height: 132px;
        resize: vertical;
        padding: 12px;
        line-height: 1.5;
      }

      select:focus,
      textarea:focus,
      button:focus-visible,
      input:focus-visible + label .star {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgb(22 114 212 / 14%);
        outline: none;
      }

      select:disabled {
        cursor: not-allowed;
        color: #7a8999;
        background: #f7f9fb;
      }

      .ratings {
        display: grid;
        gap: 17px;
        margin: 28px 0;
      }

      .rating-row {
        display: grid;
        grid-template-columns: minmax(190px, 1fr) auto;
        align-items: center;
        gap: 20px;
      }

      .rating-label {
        font-size: 14px;
        font-weight: 550;
      }

      .rating-options {
        display: flex;
        flex-direction: row-reverse;
        justify-content: flex-end;
        gap: 6px;
      }

      .rating-options input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .star {
        display: inline-block;
        padding: 2px;
        color: #cbd3dc;
        cursor: pointer;
        font-size: 27px;
        line-height: 1;
        transition: color 100ms ease, transform 100ms ease;
      }

      .rating-options input:checked ~ label .star,
      .rating-options label:hover .star,
      .rating-options label:hover ~ label .star {
        color: var(--orange);
      }

      .rating-options label:hover .star {
        transform: scale(1.08);
      }

      .rating-group {
        display: grid;
        gap: 15px;
      }

      .rating-title {
        margin: 0;
      }

      .comments-field {
        margin-top: 4px;
      }

      textarea::placeholder {
        color: #929eac;
      }

      .form-error,
      .form-success {
        margin: 18px 0 0;
        padding: 12px 14px;
        border-radius: 7px;
        font-size: 13px;
        line-height: 1.45;
      }

      .form-error {
        border: 1px solid #f0c9c9;
        color: #8e2828;
        background: #fff6f6;
      }

      .form-success {
        border: 1px solid #b9e4ca;
        color: #216b3c;
        background: #f1fbf4;
      }

      [hidden] {
        display: none !important;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 11px;
        margin-top: 22px;
      }

      .button {
        min-height: 41px;
        padding: 0 17px;
        border: 1px solid transparent;
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 650;
        transition: background 120ms ease, transform 120ms ease;
      }

      .button:active {
        transform: translateY(1px);
      }

      .button-secondary {
        border-color: #d6dee7;
        color: #485b70;
        background: #fff;
      }

      .button-secondary:hover {
        background: #f5f7f9;
      }

      .button-primary {
        color: #fff;
        background: var(--blue);
      }

      .button-primary:hover {
        background: #0e61bb;
      }

      .button-primary:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .loading-note {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 700px) {
        .sidebar {
          flex: 0 0 104px;
          min-width: 0;
          padding: 12px 5px;
        }

        .brand {
          gap: 5px;
          margin: 0 2px 22px;
          font-size: 12px;
        }

        .brand-mark {
          width: 20px;
          height: 20px;
          border-radius: 6px;
          font-size: 14px;
        }

        .nav-link {
          min-height: 25px;
          gap: 6px;
          padding: 0 5px;
          border-radius: 4px;
          font-size: 9px;
          white-space: nowrap;
        }

        .nav-links {
          gap: 5px;
        }

        .nav-icon {
          width: 12px;
          font-size: 10px;
        }

        main {
          padding: 8px 7px 8px 2px;
        }

        .form-card {
          max-width: none;
          margin: 0;
          padding: 12px 16px;
          border-radius: 7px;
          box-shadow: 0 2px 8px rgb(16 36 59 / 5%);
        }

        .form-card h2 {
          margin: -12px -16px 10px;
          padding: 9px 12px;
          border-bottom: 1px solid #edf0f4;
          font-size: 12px;
          letter-spacing: -0.01em;
        }

        .form-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .field {
          gap: 5px;
        }

        .field label,
        .rating-title {
          font-size: 9px;
        }

        select {
          min-height: 23px;
          padding: 0 6px;
          border-radius: 4px;
          font-size: 9px;
        }

        .ratings {
          gap: 7px;
          margin: 12px 0 18px;
        }

        .rating-row {
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 5px;
        }

        .rating-options {
          justify-content: flex-start;
          gap: 2px;
        }

        .star {
          padding: 1px;
          font-size: 17px;
        }

        .rating-label {
          font-size: 9px;
          white-space: nowrap;
        }

        .rating-group {
          gap: 6px;
        }

        textarea {
          min-height: 66px;
          padding: 7px;
          border-radius: 4px;
          font-size: 9px;
        }

        .form-actions {
          gap: 7px;
          margin-top: 13px;
        }

        .button {
          min-height: 22px;
          padding: 0 9px;
          border-radius: 4px;
          font-size: 9px;
        }

        .loading-note,
        .form-error,
        .form-success {
          font-size: 9px;
        }
      }

      @media (max-width: 360px) {
        .sidebar {
          flex-basis: 90px;
        }

        main {
          padding-right: 5px;
        }

        .form-card {
          padding-right: 9px;
          padding-left: 9px;
        }

        .form-card h2 {
          margin-right: -9px;
          margin-left: -9px;
        }

        .rating-row {
          grid-template-columns: 1fr;
          gap: 2px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand"><span class="brand-mark" aria-hidden="true">T</span>Testleaf</div>
        <nav class="nav-links">
          <a class="nav-link" href="#" aria-label="Dashboard"><span class="nav-icon" aria-hidden="true">⌂</span>Dashboard</a>
          <a class="nav-link" href="#" aria-label="My Reviews"><span class="nav-icon" aria-hidden="true">▤</span>My Reviews</a>
          <a class="nav-link" href="/" aria-current="page"><span class="nav-icon" aria-hidden="true">＋</span>Submit Review</a>
          <a class="nav-link" href="#" aria-label="Reviews"><span class="nav-icon" aria-hidden="true">▣</span>Reviews</a>
          <a class="nav-link" href="#" aria-label="Employees"><span class="nav-icon" aria-hidden="true">♙</span>Employees</a>
        </nav>
      </aside>

      <main>
        <section class="form-card" aria-labelledby="form-heading">
          <h2 id="form-heading">Submit Performance Review</h2>
          <form id="review-form">
            <div class="form-grid">
              <div class="field">
                <label for="employee">Employee <span class="required" aria-hidden="true">*</span></label>
                <select id="employee" name="employee_id" required disabled>
                  <option value="">Loading employees…</option>
                </select>
              </div>
              <div class="field">
                <label for="period">Review Period <span class="required" aria-hidden="true">*</span></label>
                <select id="period" name="period_id" required disabled>
                  <option value="">Loading review periods…</option>
                </select>
              </div>
            </div>

            <div class="ratings">
              <h3 class="rating-title">Performance Ratings (1–5) <span class="required" aria-hidden="true">*</span></h3>
              <div class="rating-group" id="rating-groups"></div>
            </div>

            <div class="field comments-field">
              <label for="comments">Overall Comments <span class="required" aria-hidden="true">*</span></label>
              <textarea
                id="comments"
                name="comments"
                required
                minlength="1"
                placeholder="Enter your feedback, strengths, areas of improvement…"
              ></textarea>
            </div>

            <p id="loading-note" class="loading-note" role="status">Loading employees and open review periods…</p>
            <div id="form-message" class="form-error" role="alert" hidden></div>
            <div id="success-message" class="form-success" role="status" hidden></div>

            <div class="form-actions">
              <button class="button button-secondary" type="reset">Reset</button>
              <button class="button button-primary" id="submit-button" type="submit" disabled>
                Submit Review
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <script>
      const form = document.querySelector("#review-form");
      const employeeSelect = document.querySelector("#employee");
      const periodSelect = document.querySelector("#period");
      const ratingsContainer = document.querySelector("#rating-groups");
      const message = document.querySelector("#form-message");
      const successMessage = document.querySelector("#success-message");
      const submitButton = document.querySelector("#submit-button");
      const loadingNote = document.querySelector("#loading-note");

      const ratingCriteria = [
        ["quality_rating", "Quality of Work"],
        ["delivery_rating", "Delivery & Ownership"],
        ["teamwork_rating", "Teamwork & Collaboration"],
      ];

      function showError(text) {
        message.textContent = text;
        message.hidden = false;
        successMessage.hidden = true;
      }

      function clearMessages() {
        message.hidden = true;
        successMessage.hidden = true;
      }

      async function getJson(url) {
        const response = await fetch(url, { headers: { Accept: "application/json" } });
        const body = await response.json().catch(() => null);
        if (!response.ok) {
          const detail = body?.detail;
          const reason = Array.isArray(detail)
            ? detail.map((issue) => issue.msg).join(" ")
            : typeof detail === "string"
              ? detail
              : `Request failed with status ${response.status}.`;
          throw new Error(reason);
        }
        return body;
      }

      function fillSelect(select, items, getLabel, emptyText) {
        select.replaceChildren(new Option(emptyText, ""));
        for (const item of items) {
          select.add(new Option(getLabel(item), String(item.id)));
        }
        select.disabled = items.length === 0;
        if (items.length === 0) {
          select.options[0].textContent = "No options available";
        }
      }

      function renderRatingGroups() {
        for (const [name, title] of ratingCriteria) {
          const row = document.createElement("div");
          row.className = "rating-row";

          const label = document.createElement("span");
          label.className = "rating-label";
          label.id = `${name}-label`;
          label.textContent = title;

          const options = document.createElement("div");
          options.className = "rating-options";
          options.setAttribute("role", "radiogroup");
          options.setAttribute("aria-labelledby", label.id);

          for (let value = 5; value >= 1; value -= 1) {
            const input = document.createElement("input");
            const id = `${name}-${value}`;
            input.type = "radio";
            input.id = id;
            input.name = name;
            input.value = String(value);
            input.required = value === 1;

            const optionLabel = document.createElement("label");
            optionLabel.htmlFor = id;
            optionLabel.setAttribute("aria-label", `${value} out of 5`);
            const star = document.createElement("span");
            star.className = "star";
            star.setAttribute("aria-hidden", "true");
            star.textContent = "★";
            optionLabel.append(star);

            options.append(input, optionLabel);
          }

          row.append(label, options);
          ratingsContainer.append(row);
        }
      }

      async function loadOptions() {
        try {
          const [employees, periods] = await Promise.all([
            getJson("/api/employees"),
            getJson("/api/review-periods"),
          ]);

          const activeEmployees = employees.filter((employee) => employee.status === "Active");
          const openPeriods = periods.filter((period) => period.status === "Open");

          fillSelect(
            employeeSelect,
            activeEmployees,
            (employee) => `${employee.employee_id} - ${employee.name}`,
            "Select an employee",
          );
          fillSelect(
            periodSelect,
            openPeriods,
            (period) => period.name,
            "Select a review period",
          );
          loadingNote.hidden = true;

          if (activeEmployees.length === 0 || openPeriods.length === 0) {
            showError(
              activeEmployees.length === 0
                ? "There are no active employees available."
                : "There are no open review periods available.",
            );
          } else {
            submitButton.disabled = false;
          }
        } catch (error) {
          loadingNote.hidden = true;
          showError(`Could not load form options. ${error.message}`);
        }
      }

      form.addEventListener("reset", () => {
        clearMessages();
      });

      form.addEventListener("input", clearMessages);
      form.addEventListener("change", clearMessages);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessages();

        const payload = Object.fromEntries(new FormData(form).entries());
        for (const key of ["employee_id", "period_id", ...ratingCriteria.map(([name]) => name)]) {
          payload[key] = Number(payload[key]);
        }

        submitButton.disabled = true;
        submitButton.textContent = "Submitting…";
        try {
          const response = await fetch("/api/reviews", {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });
          const body = await response.json().catch(() => null);
          if (!response.ok) {
            const detail = body?.detail;
            const reason = Array.isArray(detail)
              ? detail.map((issue) => issue.msg).join(" ")
              : typeof detail === "string"
                ? detail
                : `Request failed with status ${response.status}.`;
            throw new Error(reason);
          }

          form.reset();
          successMessage.textContent = "Review submitted successfully.";
          successMessage.hidden = false;
        } catch (error) {
          showError(`Could not submit the review. ${error.message}`);
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Submit Review";
        }
      });

      renderRatingGroups();
      loadOptions();
    </script>
  </body>
</html>
